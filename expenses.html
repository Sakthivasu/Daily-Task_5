<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker | Manage Expenses</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="dashboard-body">
    <nav class="navbar">
        <div class="nav-logo">
            <i class="fa-solid fa-wallet"></i>
            <h1>Expense Tracker</h1>
        </div>
        <div class="nav-links">
            <a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            <a href="expenses.html" class="active"><i class="fa-solid fa-money-bill-wave"></i> Expenses</a>
            <button id="logout-btn" class="logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>
    </nav>

    <main class="expenses-layout">
        <section class="dashboard-card form-section">
            <div class="card-header"><h2 id="form-title"><i class="fa-solid fa-circle-plus"></i> Add New Expense</h2></div>
            <form id="expense-form">
                <input type="hidden" id="expense-id">
                <div class="form-group">
                    <label>Expense Title</label>
                    <div class="input-box"><i class="fa-solid fa-pen"></i><input type="text" id="title" required></div>
                </div>
                <div class="form-group">
                    <label>Amount (₹)</label>
                    <div class="input-box"><i class="fa-solid fa-indian-rupee-sign"></i><input type="number" step="0.01" id="amount" required></div>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <div class="input-box">
                        <i class="fa-solid fa-layer-group"></i>
                        <select id="category" required>
                            <option value="">Select Category</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Health">Health</option>
                            <option value="Education">Education</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Expense Date</label>
                    <div class="input-box"><i class="fa-solid fa-calendar-days"></i><input type="date" id="date" required></div>
                </div>
                <div class="form-group">
                    <label>Note (Optional)</label>
                    <div class="input-box"><i class="fa-solid fa-note-sticky"></i><input type="text" id="note"></div>
                </div>
                <div class="btn-row">
                    <button type="submit" id="submit-btn" class="btn-primary">
                        <i class="fa-solid fa-floppy-disk"></i> Save Expense</button>
                    <button type="button" id="cancel-btn" class="btn-secondary hide">
                        <i class="fa-solid fa-xmark"></i> Cancel</button>
                </div>
            </form>
        </section>

        <section class="dashboard-card table-section">
            <div class="card-header"><h2><i class="fa-solid fa-list"></i> Expense Records</h2></div>
            <div class="filter-bar">
                <div class="filter-box">
                    <i class="fa-solid fa-filter"></i>
                    <select id="filter-category">
                        <option value="">All Categories</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Health">Health</option>
                        <option value="Education">Education</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="date-range">
                    <input type="date" id="filter-from"> <span>to</span> <input type="date" id="filter-to">
                </div>
                <button id="clear-filters" class="btn-secondary">
                    <i class="fa-solid fa-rotate"></i> Clear</button>
            </div>

            <div class="table-wrapper">
                <table class="expense-table">
                    <thead>
                        <tr><th>Title</th><th>Category</th><th>Amount</th><th>Date</th><th>Note</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="full-expenses-body"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
    <script>initExpensesPage();</script>
</body>
</html>
